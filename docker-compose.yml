services:
  web:
    build: .
    env_file:
      - .env
    command: ["web-server"]
    ports:
      - "8080:8080"
    volumes:
      - sync-data:/app/data
  worker:
    build: .
    env_file:
      - .env
    command: ["sync-worker"]
    volumes:
      - sync-data:/app/data
  yandex-market-worker:
    build: .
    env_file:
      - .env
    command: ["yandex-market-sync-worker"]
    volumes:
      - sync-data:/app/data
  moysklad-shift-close-worker:
    build: .
    env_file:
      - .env
    command: ["moysklad-shift-close-worker"]
    volumes:
      - sync-data:/app/data
volumes:
  sync-data:
