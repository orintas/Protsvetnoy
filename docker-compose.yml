services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
  web:
    build: .
    env_file:
      - .env
    command: ["web-server"]
    volumes:
      - sync-data:/app/data
  worker:
    build: .
    env_file:
      - .env
    command: ["sync-worker"]
    volumes:
      - sync-data:/app/data
  yandex-market-worker:
    build: .
    env_file:
      - .env
    command: ["yandex-market-sync-worker"]
    volumes:
      - sync-data:/app/data
  moysklad-shift-close-worker:
    build: .
    env_file:
      - .env
    command: ["moysklad-shift-close-worker"]
    volumes:
      - sync-data:/app/data
volumes:
  sync-data:
  caddy-data:
  caddy-config:
