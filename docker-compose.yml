services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
  telegram-proxy:
    build:
      context: .
      dockerfile: Dockerfile.xray
    env_file:
      - .env
    restart: unless-stopped
  web:
    build: .
    env_file:
      - .env
    command: ["web-server"]
    volumes:
      - sync-data:/app/data
    depends_on:
      - telegram-proxy
  worker:
    build: .
    env_file:
      - .env
    command: ["sync-worker"]
    volumes:
      - sync-data:/app/data
  yandex-market-stock-sync-worker:
    build: .
    env_file:
      - .env
    command: ["yandex-market-stock-sync-worker"]
    volumes:
      - sync-data:/app/data
  ozon-stock-sync-worker:
    build: .
    env_file:
      - .env
    command: ["ozon-stock-sync-worker"]
    volumes:
      - sync-data:/app/data
  shopify-catalog-sync-worker:
    build: .
    env_file:
      - .env
    command: ["shopify-catalog-sync-worker"]
    volumes:
      - sync-data:/app/data
  shopify-stock-sync-worker:
    build: .
    env_file:
      - .env
    command: ["shopify-stock-sync-worker"]
    volumes:
      - sync-data:/app/data
  moysklad-shift-close-worker:
    build: .
    env_file:
      - .env
    command: ["moysklad-shift-close-worker"]
    volumes:
      - sync-data:/app/data
volumes:
  sync-data:
  caddy-data:
  caddy-config:
