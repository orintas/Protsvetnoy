[project]
name = "novicloud-moysklad-sync"
version = "0.1.0"
description = "Synchronize Novicloud sales and MoySklad stock data."
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
sync-cli = "sync_service.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
