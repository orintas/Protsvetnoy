name: Deploy to Reg.ru VPS

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin
            git checkout master
            git reset --hard origin/master
            grep -q '^YANDEX_MARKET_API_KEY=' .env || cat >> .env << 'ENVEOF'

            YANDEX_MARKET_API_KEY=${{ secrets.YANDEX_MARKET_API_KEY }}
            YANDEX_MARKET_BUSINESS_ID=${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
            YANDEX_MARKET_CAMPAIGN_ID=${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
            YANDEX_MARKET_BASE_URL=https://api.partner.market.yandex.ru
            ENVEOF
            docker compose up -d --build --remove-orphans
            docker image prune -f
