name: Deploy to Reg.ru VPS

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin
            git checkout master
            git reset --hard origin/master
            grep -q '^YANDEX_MARKET_BASE_URL=' .env || echo 'YANDEX_MARKET_BASE_URL=https://api.partner.market.yandex.ru' >> .env
            grep -q '^YANDEX_MARKET_API_KEY=' .env || echo 'YANDEX_MARKET_API_KEY=' >> .env
            grep -q '^YANDEX_MARKET_BUSINESS_ID=' .env || echo 'YANDEX_MARKET_BUSINESS_ID=' >> .env
            grep -q '^YANDEX_MARKET_CAMPAIGN_ID=' .env || echo 'YANDEX_MARKET_CAMPAIGN_ID=' >> .env
            sed -i "s#^YANDEX_MARKET_API_KEY=.*#YANDEX_MARKET_API_KEY=${{ secrets.YANDEX_MARKET_API_KEY }}#" .env
            sed -i "s#^YANDEX_MARKET_BUSINESS_ID=.*#YANDEX_MARKET_BUSINESS_ID=${{ secrets.YANDEX_MARKET_BUSINESS_ID }}#" .env
            sed -i "s#^YANDEX_MARKET_CAMPAIGN_ID=.*#YANDEX_MARKET_CAMPAIGN_ID=${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}#" .env
            grep -q '^MOYSKLAD_SHIFT_CLOSE_DRY_RUN=' .env || echo 'MOYSKLAD_SHIFT_CLOSE_DRY_RUN=false' >> .env
            sed -i "s#^MOYSKLAD_TOKEN=.*#MOYSKLAD_TOKEN=${{ secrets.MOYSKLAD_TOKEN }}#" .env
            grep -q '^SHOPIFY_SHOP_DOMAIN=' .env || echo 'SHOPIFY_SHOP_DOMAIN=protsvetnoy.myshopify.com' >> .env
            grep -q '^SHOPIFY_ACCESS_TOKEN=' .env || echo 'SHOPIFY_ACCESS_TOKEN=' >> .env
            grep -q '^SHOPIFY_API_VERSION=' .env || echo 'SHOPIFY_API_VERSION=2024-07' >> .env
            grep -q '^TELEGRAM_BOT_TOKEN=' .env || echo 'TELEGRAM_BOT_TOKEN=' >> .env
            grep -q '^TELEGRAM_LABEL_CHAT_ID=' .env || echo 'TELEGRAM_LABEL_CHAT_ID=' >> .env
            grep -q '^VLESS_UUID=' .env || echo 'VLESS_UUID=' >> .env
            grep -q '^VLESS_HOST=' .env || echo 'VLESS_HOST=' >> .env
            grep -q '^VLESS_PORT=' .env || echo 'VLESS_PORT=' >> .env
            grep -q '^VLESS_PATH=' .env || echo 'VLESS_PATH=' >> .env
            grep -q '^VLESS_SNI=' .env || echo 'VLESS_SNI=' >> .env
            grep -q '^TELEGRAM_PROXY_URL=' .env || echo 'TELEGRAM_PROXY_URL=' >> .env
            docker compose up -d --build --remove-orphans
            docker image prune -f
