name: Authorize almazshema deploy key (one-off)

# Temporary: lets the orintas/almazshema repo deploy to this VPS over SSH.
# Run once by hand, then delete this file.
on:
  workflow_dispatch:

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIATU1WzDCiRIoscYtQzjMTujHcBC/O9ruL3078KI6GPx almazshema-deploy@github-actions'
            mkdir -p ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 700 ~/.ssh
            chmod 600 ~/.ssh/authorized_keys
            grep -qF "$key" ~/.ssh/authorized_keys || echo "$key" >> ~/.ssh/authorized_keys
            echo "user: $(whoami), keys: $(wc -l < ~/.ssh/authorized_keys)"
            ls -la /opt/almazshema
