name: Diagnose VPS services

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect containers over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: false
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "=== docker compose ps ==="
            docker compose ps -a
            echo
            echo "=== curl localhost:80 ==="
            curl -sv -m 5 -o /dev/null http://localhost:80/ 2>&1 || true
            echo
            echo "=== curl localhost:443 (insecure) ==="
            curl -skv -m 5 -o /dev/null https://localhost:443/ 2>&1 || true
            echo
            echo "=== caddy logs (last 100 lines) ==="
            docker compose logs --no-color --tail 100 caddy
            echo
            echo "=== ufw status ==="
            sudo ufw status verbose 2>&1 || echo "ufw not available"
            echo
            echo "=== iptables -L -n ==="
            sudo iptables -L -n 2>&1 || echo "iptables not available"
            echo
            echo "=== listening ports ==="
            sudo ss -tlnp 2>&1 || true
            echo
            echo "=== disk/memory ==="
            df -h /
            echo
            free -h
            echo
            echo "=== current server time ==="
            date
            date -u
